  <rect x="220" y="98" width="72" height="20" rx="10" fill="#1C1917"/>

  <!-- Content Lines on Paper -->
  <rect x="168" y="188" width="144" height="20" rx="10" fill="#1C1917"/>
  <rect x="168" y="228" width="176" height="16" rx="8" fill="#A8A29E"/>
  <rect x="168" y="262" width="128" height="16" rx="8" fill="#A8A29E"/>
  <rect x="168" y="296" width="104" height="16" rx="8" fill="#D6D3D1"/>

  <!-- Cloud Synced Badge -->
  <circle cx="348" cy="364" r="46" fill="#10B981" stroke="#1C1917" stroke-width="8"/>
  <path d="M328 364 L342 378 L370 350" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
