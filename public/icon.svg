<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F4"/>
    </linearGradient>
  </defs>
  <!-- Squircle App Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#44403C" stroke-width="4"/>

  <!-- Clipboard Backing Board -->
  <rect x="116" y="104" width="280" height="324" rx="40" fill="#44403C"/>
  <!-- Warm Paper Sheet -->
  <rect x="132" y="120" width="248" height="292" rx="28" fill="url(#sheetGrad)"/>

  <!-- Top Metallic Clasp -->
